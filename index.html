<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Pulse News</title>
    <style>
        :root {
            --bg-color: #f4f4f4;
            --card-bg: #ffffff;
            --text-main: #121212;
            --text-muted: #555555;
            --border-color: #dddddd;
            --accent: #bb1919;
            --ai-bg: #ffffff;
        }
        [data-theme="dark"] {
            --bg-color: #0d0d0d;
            --card-bg: #161616;
            --text-main: #f1f1f1;
            --text-muted: #999999;
            --border-color: #2a2a2a;
            --accent: #ff3b3b;
            --ai-bg: #1f1f1f;
        }
        body {
            font-family: Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }
        header {
            background-color: var(--card-bg);
            border-bottom: 4px solid var(--accent);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-area h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
        }
        .theme-toggle-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .cats-bar {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 30px;
            display: flex;
            gap: 15px;
            overflow-x: auto;
        }
        .cat-tab {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            padding: 6px 12px;
            white-space: nowrap;
            transition: color 0.2s;
        }
        .cat-tab.active, .cat-tab:hover {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
        }
        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #333;
        }
        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .tag {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 8px;
            display: inline-block;
        }
        .card-title {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.35;
            margin: 0 0 12px 0;
            color: var(--text-main);
            text-decoration: none;
        }
        .card-title:hover {
            color: var(--accent);
        }
        .news-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: auto;
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
        }
        .read-more {
            text-decoration: none;
            color: var(--accent);
            font-weight: bold;
            font-size: 13px;
        }

        /* AI Maintenance Box Styles */
        .ai-fab {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            background: var(--accent);
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 900;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 1000;
        }
        .ai-chat-box {
            position: fixed;
            bottom: 95px;
            right: 25px;
            width: 340px;
            background: var(--ai-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
        }
        .ai-chat-header {
            background: var(--accent);
            color: white;
            padding: 12px 16px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .ai-chat-body {
            padding: 20px;
            font-size: 13px;
            color: var(--text-main);
            line-height: 1.6;
            text-align: center;
        }
        .ai-close {
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>Global Pulse</h1>
        </div>
        <button class="theme-toggle-btn" onclick="toggleTheme()">Dark / Light</button>
    </header>

    <div class="cats-bar">
        <button class="cat-tab active" onclick="loadNews('general', this)">Trending</button>
        <button class="cat-tab" onclick="loadNews('world', this)">World</button>
        <button class="cat-tab" onclick="loadNews('technology', this)">Technology</button>
        <button class="cat-tab" onclick="loadNews('business', this)">Business</button>
        <button class="cat-tab" onclick="loadNews('sports', this)">Sports</button>
    </div>

    <div class="container">
        <div class="news-grid" id="news-grid"></div>
    </div>

    <!-- AI Maintenance Widget -->
    <div class="ai-fab" onclick="toggleAIChat()">GN</div>

    <div class="ai-chat-box" id="aiChatBox">
        <div class="ai-chat-header">
            <span>Global Knowledge & AI Studio</span>
            <button class="ai-close" onclick="toggleAIChat()">×</button>
        </div>
        <div class="ai-chat-body">
            <strong>Notice:</strong><br><br>
            AI Assistant is temporarily unavailable due to scheduled system maintenance and server upgrades. We will be back online shortly. Thank you for your patience!
        </div>
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
            } else {
                html.setAttribute('data-theme', 'dark');
            }
        }

        function toggleAIChat() {
            const box = document.getElementById('aiChatBox');
            if (box.style.display === 'flex') {
                box.style.display = 'none';
            } else {
                box.style.display = 'flex';
            }
        }

        // Fast Live News Loader with Exact Timestamps
        function loadNews(category, btnElement) {
            const tabs = document.querySelectorAll('.cat-tab');
            tabs.forEach(t => t.classList.remove('active'));
            if (btnElement) {
                btnElement.classList.add('active');
            } else {
                tabs[0].classList.add('active');
            }

            const newsData = {
                general: [
                    { title: "Global financial markets adjust as major international economic policies take effect", source: "Global Wire", time: "12 mins ago", img: "https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=600&q=80" },
                    { title: "International diplomatic summit addresses cooperative security frameworks in Europe", source: "World News", time: "34 mins ago", img: "https://images.unsplash.com/photo-1541872703-74c5e44368f9?auto=format&fit=crop&w=600&q=80" },
                    { title: "Major technological breakthrough accelerates automated cloud data processing worldwide", source: "Tech Pulse", time: "1 hour ago", img: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=600&q=80" },
                    { title: "World sports federation announces official venues for upcoming global championships", source: "Sports Arena", time: "2 hours ago", img: "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=600&q=80" }
                ],
                world: [
                    { title: "Cross-border trade agreements signed by leaders during the annual international forum", source: "Global Pulse", time: "25 mins ago", img: "https://images.unsplash.com/photo-1541872703-74c5e44368f9?auto=format&fit=crop&w=600&q=80" },
                    { title: "UN security council reviews new global humanitarian assistance guidelines", source: "Diplomacy Daily", time: "1 hour ago", img: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=600&q=80" }
                ],
                technology: [
                    { title: "Next-gen quantum computing architecture achieves breakthrough processing speeds", source: "Tech Times", time: "18 mins ago", img: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=600&q=80" },
                    { title: "Global cybersecurity alliance launches advanced defense framework against network threats", source: "Cyber Wire", time: "45 mins ago", img: "https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=600&q=80" }
                ],
                business: [
                    { title: "Global stock indices experience steady growth following positive economic indicators", source: "Market Watch", time: "30 mins ago", img: "https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=600&q=80" },
                    { title: "Major multinational corporations invest heavily in sustainable energy infrastructure", source: "Business Standard", time: "2 hours ago", img: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=600&q=80" }
                ],
                sports: [
                    { title: "World Cup final thriller: Dramatic last-minute victory stuns millions of fans", source: "Sports Central", time: "10 mins ago", img: "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=600&q=80" },
                    { title: "International athletics federation sets new qualifying standards for global games", source: "Athletic News", time: "1 hour ago", img: "https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=600&q=80" }
                ]
            };

            const grid = document.getElementById('news-grid');
            let items = newsData[category] || newsData.general;
            let html = "";
            items.forEach(item => {
                html += `
                    <div class="card">
                        <img src="${item.img}" alt="News" class="card-img">
                        <div class="card-body">
                            <span class="tag">${item.source}</span>
                            <a href="#" class="card-title">${item.title}</a>
                            <div class="news-meta">
                                <span>${item.time}</span>
                                <a href="#" class="read-more">Full Story &rarr;</a>
                            </div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        window.onload = function() {
            loadNews('general');
        };
    </script>
</body>
    </html>
